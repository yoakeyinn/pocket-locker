[platformio]
default_envs = esp32dev
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Pruebas con 2 LEDs (GPIO 26 garaje, GPIO 27 peatonal -> resistencia -> LED -> GND)
[env:esp32dev_leds]
extends = env:esp32dev
build_flags = -DMODO_LEDS_PRUEBA=1
